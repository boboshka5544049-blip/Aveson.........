name: Build AVESON V9 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          set -e
          test -f AVESON_V9/android/settings.gradle
          test -f AVESON_V9/android/build.gradle
          test -f AVESON_V9/android/app/build.gradle
          echo "AVESON V9 project found."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: AVESON_V9/android
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Check APK
        run: |
          test -f AVESON_V9/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh AVESON_V9/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-V9-APK
          path: AVESON_V9/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
