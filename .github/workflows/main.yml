name: Build AVESON V9 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            echo "Repository files:"
            find . -maxdepth 5 -type f \
              -not -path "./.git/*" \
              | sort | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app folder not found:"
            echo "$PROJECT_DIR/app"
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-V9-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
