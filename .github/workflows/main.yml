name: AVESON V9 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          set -e

          echo "=== Searching for AVESON Android project ==="

          if [ -f "AVESON_V9/android/settings.gradle" ]; then
            PROJECT_DIR="AVESON_V9/android"

          elif [ -f "android/settings.gradle" ]; then
            PROJECT_DIR="android"

          else
            ZIP=$(find . -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)

            if [ -n "$ZIP" ]; then
              echo "Found ZIP: $ZIP"

              mkdir -p extracted
              unzip -q -o "$ZIP" -d extracted

              SETTINGS=$(find extracted -type f \
                -name "settings.gradle" \
                -not -path "*/.git/*" \
                | head -n 1)

              if [ -n "$SETTINGS" ]; then
                PROJECT_DIR=$(dirname "$SETTINGS")
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            echo "Repository structure:"
            find . -maxdepth 5 -type f \
              -not -path "./.git/*" \
              | sort
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app folder not found!"
            exit 1
          fi

          echo "================================"
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== APK ==="
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-V9-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
